name: Desktop CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package ${{ matrix.target }} x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-24.04
            editor: .tools/godot/godot
          - target: windows
            os: windows-2025
            editor: .tools/godot/godot.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache pinned editor and native templates
        id: engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/godot/godot*
            .tools/godot/_sc_
            .tools/godot/editor_data/export_templates
          key: godot-${{ runner.os }}-x64-${{ hashFiles('scripts/install_ci_godot.py') }}
      - if: steps.engine.outputs.cache-hit != 'true'
        run: python scripts/install_ci_godot.py
      - name: Import, run regression tests, export and start the unpacked game
        run: python scripts/build.py --target ${{ matrix.target }} --godot ${{ matrix.editor }} --test --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: dist/GarbageHero-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency: release-${{ github.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish both verified packages with SHA-256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          awk -v heading="## [${TAG#v}]" 'index($0,heading)==1 {keep=1;next} /^## / {keep=0} keep {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cd dist
          assets=("GarbageHero-$TAG-windows-x86_64.zip" "GarbageHero-$TAG-linux-x86_64.tar.gz")
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          if state=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$state" == false ]]; then
              echo "This tag already has a published release."
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "Garbage Hero $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" "${assets[@]}" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
